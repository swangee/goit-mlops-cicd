apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-pushgateway
  namespace: infra-tools
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-pushgateway
    targetRevision: 3.6.1
    helm:
      valuesObject:
        replicaCount: 1

        service:
          type: ClusterIP
          port: 9091

        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 100m

        # Скрейпиться Prometheus'ом зі стеку kube-prometheus-stack.
        # Лейбл release має збігатися з ім'ям релізу стеку, інакше
        # serviceMonitorSelector його не підбере.
        serviceMonitor:
          enabled: true
          # Чарт за замовчуванням ставить namespace: monitoring, якого немає.
          namespace: infra-tools
          additionalLabels:
            release: kube-prometheus-stack

  destination:
    server: https://kubernetes.default.svc
    namespace: infra-tools

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
